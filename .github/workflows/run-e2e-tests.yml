name: Run end-to-end tests

permissions: read-all

# On demand from the default branch only. These tests create fixtures in one
# live Trello account, so running them per pull request would let concurrent
# runs collide, and fork PRs cannot read the secrets they need. The
# default-branch gate also keeps a manual dispatch of an untrusted ref from
# running repository code with the account credentials.
on:
  workflow_dispatch:

concurrency:
  group: trello-e2e
  cancel-in-progress: false

jobs:
  run-e2e-tests:
    name: End-to-end tests against the Trello API
    runs-on: ubuntu-latest
    # Two legs (standalone CLI, then the same suite via sdkck) at up to 2
    # minutes per test.
    timeout-minutes: 45
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Check out repository
        # Pinned to a full SHA: these actions run before repository code gets
        # the credentials, so a moved mutable tag could swap what executes.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          # Nothing here pushes, and the default would leave GITHUB_TOKEN in
          # the workspace git config for every later step to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI
        run: npm run build

      # The account credentials are scoped to the step that actually talks to
      # Trello, so nothing before it — actions, `npm ci` lifecycle scripts,
      # the build — ever has them in its environment.
      - name: Run end-to-end tests
        run: npm run e2e:mocha
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_SECRET: ${{ secrets.TRELLO_SECRET }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # Second leg: the same suite through the latest sdkck host CLI with this
      # build packed and installed as its @hesed/trello plugin — covering the
      # `prepack` artifacts (oclif.manifest.json, README) and plugin dispatch
      # under a host. The plugin is installed before any `sdkck trello` call so
      # sdkck's first-use auto-installer cannot fetch the published release
      # over this build. The throwaway sdkck home (mktemp -d) keeps the
      # install, config and caches out of the runner's real sdkck setup; the
      # test side finds it via E2E_SDKCK_HOME.
      - name: Install the latest sdkck and the packed plugin
        run: |
          npm install --no-save sdkck
          home="$(mktemp -d)"
          echo "E2E_SDKCK_HOME=$home" >> "$GITHUB_ENV"
          # A `file:` URL is required: sdkck resolves any bare path containing
          # a slash as a GitHub org/repo. Packing into the throwaway home
          # keeps the tarball out of the workspace.
          tgz="$(npm pack --pack-destination "$home" | tail -n 1)"
          SDKCK_CACHE_DIR="$home/cache" \
          SDKCK_CONFIG_DIR="$home/config" \
          SDKCK_DATA_DIR="$home/data" \
            ./node_modules/.bin/sdkck plugins install "file:$home/$tgz"

      - name: Run end-to-end tests via sdkck
        run: npm run e2e:mocha
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_SECRET: ${{ secrets.TRELLO_SECRET }}
          E2E_HOST_CLI: sdkck
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E2E_SDKCK_HOME: ${{ env.E2E_SDKCK_HOME }}

  # A separate job, not a step with `if: always()`: a job cancelled by its
  # timeout-minutes never starts its remaining steps, so an in-job fallback
  # sweep would be skipped in exactly the scenario it exists for. A dependent
  # job with `if: always()` still runs when the test job fails, times out, or
  # is cancelled — only a skipped run (dispatch from a non-default branch)
  # has nothing to reclaim. E2E_RUN_ID is derivable in any job of the same
  # workflow run, which is what lets this sweep close the test job's board.
  sweep-fixtures:
    name: Sweep leftover fixtures
    runs-on: ubuntu-latest
    needs: run-e2e-tests
    if: always() && needs.run-e2e-tests.result != 'skipped'
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # Closes this run's board (E2E_RUN_ID) and any fixture boards older
      # than the stale threshold.
      - name: Sweep leftover fixtures
        run: npm run e2e:sweep
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_SECRET: ${{ secrets.TRELLO_SECRET }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
