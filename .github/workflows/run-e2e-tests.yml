name: Run end-to-end tests

permissions: read-all

# Nightly and on demand only. These tests create fixtures in one live Trello
# account, so running them per pull request would let concurrent runs collide,
# and fork PRs cannot read the secrets they need.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: trello-e2e
  cancel-in-progress: false

jobs:
  run-e2e-tests:
    name: End-to-end tests against the Trello API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          # Nothing here pushes, and the default would leave GITHUB_TOKEN in
          # the workspace git config for every later step to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # The steps below are what `npm run test:e2e` does locally, split out so
      # the sweep still runs when a test fails.
      - name: Build the CLI
        run: npm run build

      # The account credentials are scoped to the two steps that actually talk
      # to Trello, so nothing before them — actions, `npm ci` lifecycle
      # scripts, the build — ever has them in its environment.
      - name: Run end-to-end tests
        run: npm run e2e:mocha
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_SECRET: ${{ secrets.TRELLO_SECRET }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # `always()`, so a killed mocha run (the job timeout above skips its
      # `after` hooks) still gets its fixtures reclaimed. E2E_RUN_ID is what
      # makes that possible: it pins this run's board name so the sweep can
      # close this run's fixtures, not just the ones older than an hour.
      - name: Sweep leftover fixtures
        if: always()
        run: npm run e2e:sweep
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_SECRET: ${{ secrets.TRELLO_SECRET }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
